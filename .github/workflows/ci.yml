name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: check out the code
        uses: actions/checkout@v4
      
      - name: install node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: enter the client folder
        run: cd client

      - name: install dependencies
        run: npm ci

      - name: run electron tests
        run: npm test